name: Collect GBFS

on:
  schedule:
    # Station status: every 15 minutes. GitHub queues scheduled jobs, so actual
    # firing times drift by a few minutes and occasionally skip. That's fine —
    # the collector stamps each file with its own UTC fetch time.
    - cron: "*/15 * * * *"
    # Station information (names, lat/lon, capacity) changes rarely.
    # Once a day at 05:10 UTC is plenty.
    - cron: "10 5 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Snapshot feeds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ "${{ github.event.schedule }}" = "10 5 * * *" ]; then
            python ingest/collect_gbfs.py --feeds station_status station_information
          else
            python ingest/collect_gbfs.py --feeds station_status
          fi