name: Collect GBFS

on:
  schedule:
    - cron: "5 * * * *"      # hourly; the loop below handles frequency
    - cron: "10 5 * * *"     # daily reference feeds
  workflow_dispatch:

concurrency:
  group: collect-gbfs
  cancel-in-progress: false   # never run two collectors at once

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ingest/requirements.txt

      - name: Snapshot feeds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ "${{ github.event.schedule }}" = "10 5 * * *" ]; then
            python ingest/collect_gbfs.py --feeds station_status station_information
            exit 0
          fi
          # Snapshot every 5 minutes for ~55 minutes. One scheduled trigger,
          # twelve observations — decouples our sampling rate from GitHub's
          # willingness to fire cron.
          for i in $(seq 1 12); do
            python ingest/collect_gbfs.py --feeds station_status || true
            [ "$i" -lt 12 ] && sleep 300
          done